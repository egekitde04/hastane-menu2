<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hastane Hızlı Erişim</title>
    <style>
        /* Sayfa Genel Ayarları */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Kaydırma çubuklarını gizler */
            position: relative; 
        }

        /* --- ARKA PLAN RESMİ AYARLARI (YENİ SİSTEM) --- */
        body::before {
            content: "";
            position: fixed; /* Resmi sayfaya sabitler */
            top: 0; left: 0; width: 100%; height: 100%;
            
            /* RESİM DOSYANI BURAYA YAZ: */
            background-image: url('background.jpg');
            
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1; /* Resmi en arkaya atar */

            /* --- !!! AYAR KISMI BURASI !!! --- */
            
            /* 1. SAYDAMLIK (Opacity): 
               0.0 (görünmez) ile 1.0 (tam net) arasında sayı ver.
               Örnek: 0.5 yaparsan %50 saydam olur, arkadaki beyaz fon görünür. */
            opacity: 0.7; 

            /* 2. PARLAKLIK (Brightness):
               1.0 normaldir. 
               0.5 yaparsan kararır (karanlık mod gibi olur).
               1.5 yaparsan çok parlar. */
            filter: brightness(0.6); 
            
            /* 3. BULANIKLIK (Blur) - İstersen açabilirsin:
               Resmi biraz flulaştırır, yazı daha iyi okunur. 
               İstemiyorsan 0px yap. */
            filter: blur(3px); 
        }

        /* Sol Üst Logo */
        .sol-ust-resim {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 150px;
            height: auto;
            z-index: 15;
        }

        /* Ortadaki Kutu */
        .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.90); /* Kutunun kendi beyazlığı */
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            z-index: 1; /* Kutuyu resmin önüne alır */
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        /* Butonlar */
        .btn {
            display: block;
            width: 250px;
            padding: 20px;
            margin: 15px auto;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .kan-bankasi { background-color: #e74c3c; }
        .kan-bankasi:hover { background-color: #c0392b; }

        .vezne { background-color: #3498db; }
        .vezne:hover { background-color: #2980b9; }


        /* --- !!! MOBİL AYARLARI (TELEFON İÇİN) !!! --- */
        /* Ekran genişliği 600px'den küçükse (Telefonlar) bu kurallar devreye girer */
        @media screen and (max-width: 600px) {
            
            /* 1. Logoyu küçültüp biraz daha yukarı alıyoruz */
            .sol-ust-resim {
                width: 70px;  /* Logo boyutu küçüldü */
                top: 15px;
                left: 15px;
            }

            /* 2. Kutunun kenar boşluklarını daraltıyoruz ki ekrana sığsın */
            .container {
                width: 85%;       /* Ekranın %85'ini kaplasın */
                padding: 30px 20px; /* İç boşluğu azalttık */
            }

            /* 3. Başlık yazısını biraz küçültüyoruz */
            h1 {
                font-size: 22px;
                margin-top: 10px; /* Logoya değmesin diye */
            }

            /* 4. Butonları mobilde tam genişlik yapıyoruz */
            .btn {
                width: 100%;      /* Kutu ne kadarsa buton o kadar olsun */
                box-sizing: border-box; /* Kenarlardan taşmayı engeller */
                font-size: 16px;  /* Yazı bir tık küçülsün */
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <img src="ege.png" alt="Logo" class="sol-ust-resim">

    <div class="container">
        <h1>Nereye gitmek istiyorsunuz ?</h1>

        <a href="https://nasılgiderim.my.canva.site/dahxt2qrwgi" class="btn kan-bankasi">
            🩸 Kan Bankası
        </a>

        <a href="https://nasılgiderim.my.canva.site" class="btn vezne">
            💳 Vezne
        </a>
    </div>

</body>
</html>
